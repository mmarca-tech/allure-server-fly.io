# fly.toml app configuration file generated for allure-server-ui-flyio on 2025-07-04T15:33:58+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'allure-server-ui-flyio'
primary_region = 'arn'

[build]
  image = 'frankescobar/allure-docker-service-ui'

[env]
  ALLURE_DOCKER_PUBLIC_API_URL = 'https://allure-server-flyio.fly.dev'
  ALLURE_DOCKER_PUBLIC_API_URL_PREFIX = ''

[http_service]
  internal_port = 5252
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
